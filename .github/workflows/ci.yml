name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]  # edited: image-key re-reads the body
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event.action == 'edited' && 'edit' || 'run' }}
  cancel-in-progress: true

jobs:
  lint:
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.24"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python scripts/check-feature-map.py
      - run: uv run python scripts/check-claude-md.py
      - if: github.event_name == 'pull_request'
        run: uv run python scripts/check-docs-same-pr.py "origin/${{ github.base_ref }}"

  types:
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.24"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run mypy

  test:
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.24"
          enable-cache: true
      - run: uv sync --locked
      - run: git config --global user.email ci@vigil.invalid && git config --global user.name vigil-ci
      # Docker and live tests are deselected by pytest's addopts. They run on
      # the Mac (pytest -m docker, pytest -m live) and their output goes in the PR.
      - run: uv run pytest -q -n auto

  # Does this PR change an input of any dev-image key or of the executor layer
  # digest (scripts/image-key-check.py, from vigild.devimage.key_input_paths)?
  # If so: label it, require a `Rebuilds images:` line in the body, and build
  # vigil's dev image and run its dev_suites offline. The session layer needs
  # claude-mods as a build context, which CI doesn't have, so it isn't built.
  # No secret and no model call. pull-requests: write is for the label only.
  image-key:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false  # nothing before the label step can reuse the write token
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.24"
          enable-cache: true
      - run: uv sync --locked
      - id: key
        run: uv run python scripts/image-key-check.py --base "origin/${{ github.base_ref }}"
      - name: Label
        if: github.event.pull_request.head.repo.full_name == github.repository  # a fork's token can't write
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          CHANGED: ${{ steps.key.outputs.changed }}
        run: scripts/image-key-label.sh
      - name: The body says which images
        if: steps.key.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        # the live body (a re-run replays the old payload), never interpolated into the line
        run: |
          PR_BODY="$(gh pr view "$PR" --json body -q .body)"
          export PR_BODY
          uv run python scripts/image-key-check.py --check-body
      - name: Build vigil's dev image and run its suites offline
        if: steps.key.outputs.changed == 'true'
        run: uv run python scripts/image-key-check.py --validate
      - name: Summary
        if: always() && steps.key.outputs.changed == 'true'
        run: >-
          echo "Built the dev image for thomasbardhi01/vigil and ran its suites offline.
          The session (executor) layer was NOT built: it needs claude-mods as a build
          context, which CI does not have. After merge, run vigil dev-image."
          >> "$GITHUB_STEP_SUMMARY"
