# Hard stops (B14). Every session reserves its max_cost_usd before it
# starts; a start is refused unless spent + open reservations + this one fit
# under the daily and the monthly cap. The gateway refuses a call that would
# take a session past its reservation. Days and months are UTC.
daily_usd: 5.00
per_task_usd: 2.00
monthly_usd: 100.00      # mandatory (P4, owner 2026-10-22)
wip_per_repo: 4          # enforced by the phase 2 scheduler
coord_session_usd: 2.00  # reservation for one coord drafting session
decider_call_usd: 0.01   # reservation for one Haiku decider call
hidden_tests_session_usd: 1.00  # cap for one task's whole author stage, regeneration included (Sonnet)
# Each model call's output is capped at this for every coord and worker session
# (CLAUDE_CODE_MAX_OUTPUT_TOKENS). The gateway holds max_tokens of output at
# the model's price against a session's reservation, so an uncapped Opus call
# ($20/M) could cost more than the reservation before it began.
session_max_output_tokens: 16384
# Review and audit caps (owner, 2026-10-23): per-session limits, checked call
# by call (spend so far plus the next call's worst case), never reserved at
# dispatch. A job reserves its review stage once, when it enters review:
# (reviewer + auditor) x the tasks under review; sessions draw from that and
# the rest goes back when the pass ends. A review or audit that would cross its
# cap completes, its overage charged to the day (still a hard stop); a shape's
# second overage pages. Starting values: re-size them from real ParkAgent
# reviews after the phase 1 run. Not counted in the task's cap.
review_session_usd: 0.40 # one reviewer session (Sonnet)
audit_session_usd: 0.80  # one auditor session (Opus)
# Haiku decisions Jev couldn't give (drift, failure, Cloudflare credit), per
# repo per UTC day. Jev costs cents a day, so a dollar of fallback means it has
# drifted or is failing: the repo's breaker trips, pages, and holds its
# dispatch until the owner resets it (owner, 2026-10-23).
decider_fallback_per_repo_usd: 1.00
# The experiment line (owner, 2026-10-27; vigil bench, issue #8). Bench jobs
# (source: bench) reserve from this monthly ledger and NEVER from daily_usd;
# their spend still counts toward monthly_usd. Both are hard stops, and a bench
# reservation the line has no room for is refused (bench does not queue): the run
# records `budget` as its failure tag. $30 buys 2-6 Smoke runs a month and no Core
# run until the baseline shows real costs; raising it is the owner's edit.
experiment_monthly_usd: 30.00
# One bench task's own cap, in place of per_task_usd (proposed $1.50).
bench_task_usd: 1.50
